
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai

    google:
      genai:
        api-key: ${GOOGLE_API}

        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
            temperature: 0.2

        embedding:
          api-key: ${GOOGLE_API}
          text:
            model: gemini-embedding-001
            dimensions: 1536

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  rag:
    chunk-size: 700
    # chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "https://synapse-frontend-psi-six.vercel.app"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

bootui:
  enabled: ON

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
